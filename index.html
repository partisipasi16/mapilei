function dt(d,j,end){return new Date(d+'T'+(j?j.slice(0,5)+':00':(end?'23:59:59':'00:00:00')))}

 $('#pc').onchange=e=>{if(e.target.type!='file')return;const j=e.target.id.slice(1),f=e.target.files[0],pv=$('#pv'+j);if(f){pv.src=URL.createObjectURL(f);pv.classList.remove('hide')}else pv.classList.add('hide')};
 $('#pc').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.x){askConfirm('Hapus calon?',b.dataset.n+' akan dihapus dari daftar.',async()=>{await sb.from('calon').delete().eq('id',b.dataset.x);loadCalon(b.dataset.j)});return}
  const j=b.dataset.s;if(!j)return;const m=$('#ms'+j),g=i=>$('#'+i+j).value.trim(),f=$('#f'+j).files[0];m.className='msg';
  if(!g('n')){m.textContent='Nama calon wajib diisi.';return}
  if(!f){m.textContent='Upload foto calon (JPG, PNG, atau WebP).';return}
  if(!['image/jpeg','image/png','image/webp'].includes(f.type)){m.textContent='Format foto harus JPG, PNG, atau WebP.';return}
  if(f.size>2*1024*1024){m.textContent='Ukuran foto maksimal 2 MB.';return}
  b.disabled=true;const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type],path=S.kelurahan.replace(/[^a-z0-9]/gi,'_')+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const up=await sb.storage.from('foto-calon').upload(path,f,{contentType:f.type});
  if(up.error){m.textContent='Gagal upload foto: '+up.error.message;b.disabled=false;return}
  const url=sb.storage.from('foto-calon').getPublicUrl(path).data.publicUrl;
  const {error}=await sb.from('calon').insert({kelurahan:S.kelurahan,rw:S.rw,rt:S.rt,jenis:j,nama:g('n'),pendidikan:g('e'),pekerjaan:g('k'),alamat:g('a'),visi:g('v'),misi:g('m'),program:g('g'),foto_url:url,created_by:S.hp});
  b.disabled=false;if(error){m.textContent=error.message;return}
  ['n','e','k','a','v','m','g'].forEach(i=>$('#'+i+j).value='');$('#f'+j).value='';$('#pv'+j).classList.add('hide');m.className='msg ok';m.textContent='Calon tersimpan.';loadCalon(j)};
 // --- Pendataan warga
 const ml=$('#ml');ml.append(memRow());$('#add').onclick=()=>ml.append(memRow());
 $('#sv').onclick=async()=>{const m=$('#m');m.className='msg';const nkk=$('#nkk').value.trim();
  const ang=[...ml.children].map(d=>({nkk,nik:d.querySelector('.nik').value.trim(),nama:d.querySelector('.nama').value.trim(),jk:d.querySelector('.jk').value,hubungan:d.querySelector('.hub').value,tempat_lahir:d.querySelector('.tl').value.trim(),tgl_lahir:d.querySelector('.tg').value||null,pekerjaan:d.querySelector('.pk').value.trim()}));
  if(nkk.length!=16||!$('#nkp').value.trim()||$('#nkik').value.trim().length!=16){m.textContent='NKK dan NIK Kepala Keluarga harus 16 digit, dan Nama KK wajib diisi.';return}
  if(ang.some(a=>a.nik.length!=16||!a.nama||!a.jk)){m.textContent='Setiap anggota wajib punya NIK 16 digit, nama, dan jenis kelamin.';return}
  const ns=ang.map(a=>a.nik);if(new Set(ns).size<ns.length){m.textContent='Ada NIK ganda di dalam form ini.';return}
  const dn=await sb.from('anggota').select('nik,nama').in('nik',ns);if(dn.data&&dn.data.length){m.textContent='NIK sudah terdaftar: '+dn.data.map(x=>x.nik+' ('+x.nama+')').join(', ');return}
  const dk=await sb.from('keluarga').select('nkk').eq('nkk',nkk).maybeSingle();if(dk.data){m.textContent='NKK sudah terdaftar.';return}
  const k=await sb.from('keluarga').insert({nkk,nama_kk:$('#nkp').value.trim(),nik_kk:$('#nkik').value.trim(),alamat:$('#al').value.trim(),hp:$('#hk').value.trim(),kelurahan:S.kelurahan,rw:S.rw,rt:S.rt,created_by:S.hp});
  if(k.error){m.textContent=k.error.message;return}
  const a=await sb.from('anggota').insert(ang);if(a.error){await sb.from('keluarga').delete().eq('nkk',nkk);m.textContent=a.error.message;return}
  await petugas(A,'pd');$('#m').className='msg ok';$('#m').textContent='Keluarga tersimpan.'};
 if(open){show(open);document.querySelectorAll('.menu button')[1].classList.add('on')}}

async function warga(A){const [l,p]=await counts(S,false);const tl=await getTl(S.kelurahan);const {data}=await sb.from('anggota').select('nama,hubungan,jk').eq('nkk',S.nkk);
 const mask='*'.repeat(16);let vis=false;
 A.innerHTML=head(esc(S.nama_kk),'NIK <span id="nk">'+mask+'</span><button class="eb" id="ne" type="button" aria-label="Tampilkan NIK">'+ic(EYE,18)+'</button>',`<div class="hd">${donut(l,p,104,true)}<button class="btn" id="sel">Selengkapnya</button></div>`,'ttl')+`<main>${tlCard(tlHtml(tl))}
 <div class="card"><h3>Anggota Keluarga</h3><div class="scroll"><table><tr><th>Nama</th><th>Hubungan</th><th>JK</th></tr>${(data||[]).map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.hubungan||'')}</td><td>${r.jk}</td></tr>`).join('')}</table></div></div>
 <div class="card pnl hide" id="pw"><h3>Data Warga RW ${S.rw}</h3><div class="scroll" id="wg"></div></div></main>`;
 $('#ne').onclick=()=>{vis=!vis;$('#nk').textContent=vis?(S.nik_kk||'-'):mask;$('#ne').innerHTML=ic(vis?EYEOFF:EYE,18);$('#ne').setAttribute('aria-label',vis?'Sembunyikan NIK':'Tampilkan NIK')};
 $('#sel').onclick=()=>{show('pw');listWarga($('#wg'),{kelurahan:S.kelurahan,rw:S.rw},false)}}
</script></body></html>
